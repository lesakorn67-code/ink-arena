<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чорнильна арена — шутер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #d9d2bf;
    --paper: #f6f1e4;
    --ink: #1c1b29;
    --blue: #2d4bff;
    --orange: #ff5a2e;
    --green: #17936a;
    --shadow: rgba(28, 27, 41, .55);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #14131c; }
  }
  :root[data-theme="dark"] { --page: #14131c; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%; background: var(--page); color: var(--ink);
    font-family: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; width: 100%; height: 100%; display: grid; place-items: center; touch-action: none; cursor: crosshair; }
  #game { display: block; border: 3px solid var(--ink); border-radius: 6px; }

  #hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
  .chip {
    background: var(--paper); border: 3px solid var(--ink); border-radius: 10px;
    padding: 4px 10px; font-weight: 600; font-size: 15px; line-height: 1.3; min-height: 32px;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .chip b { font-family: 'Unbounded', system-ui, sans-serif; font-weight: 800; font-size: 15px; }
  .meter { width: 110px; height: 12px; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; background: #fffdf6; }
  .meter i { display: block; height: 100%; width: 100%; background: var(--green); transform-origin: left; }
  .meter.dash i { background: var(--blue); }
  .meter.boss i { background: #c81d4a; }
  #hpFill.low { background: var(--orange); }
  .spacer { flex: 1; }
  #muteBtn { pointer-events: auto; cursor: pointer; font: inherit; color: inherit; }
  #muteBtn:focus-visible, .btn:focus-visible, #dashBtn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  #overlay { position: absolute; inset: 0; display: grid; place-items: center; background: var(--shadow); padding: 16px; cursor: default; }
  #overlay[hidden] { display: none; }
  .panel {
    width: 100%; max-width: 440px; background: var(--paper); border: 3px solid var(--ink); border-radius: 14px;
    padding: 24px; box-shadow: 6px 6px 0 var(--ink); max-height: 100%; overflow-y: auto;
  }
  .panel h1 { font-family: 'Unbounded', system-ui, sans-serif; font-weight: 800; font-size: clamp(24px, 6vw, 32px); line-height: 1.1; margin: 0 0 12px; }
  .panel p { margin: 0 0 14px; line-height: 1.5; font-size: 16px; max-width: 60ch; }
  .panel .big { font-family: 'Unbounded', system-ui, sans-serif; font-weight: 800; font-size: 56px; line-height: 1; margin: 4px 0 12px; color: var(--blue); }
  .keys { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0 0 14px; font-size: 15px; line-height: 1.4; }
  .keys dt { font-weight: 800; }
  .keys dd { margin: 0; }
  .note { font-size: 14px; opacity: .8; }
  .btn {
    font: inherit; font-weight: 800; font-size: 17px; color: var(--paper); background: var(--ink);
    border: 3px solid var(--ink); border-radius: 10px; padding: 10px 22px; cursor: pointer; box-shadow: 4px 4px 0 var(--orange);
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--orange); }

  #dashBtn {
    display: none; position: absolute; right: 16px; bottom: 16px; width: 76px; height: 76px; border-radius: 50%;
    background: var(--paper); border: 3px solid var(--ink); color: var(--ink); font: 800 14px 'Onest', system-ui, sans-serif;
    box-shadow: 3px 3px 0 var(--ink); touch-action: none;
  }
  body.touch #dashBtn.on { display: block; }
  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <div id="hud" aria-live="off">
    <div class="chip" title="Здоров'я"><span>Життя</span><div class="meter"><i id="hpFill"></i></div></div>
    <div class="chip" title="Ривок"><span>Ривок</span><div class="meter dash"><i id="dashFill"></i></div></div>
    <div class="chip">Рахунок <b id="score">0</b></div>
    <div class="chip">Хвиля <b id="wave">1</b></div>
    <div class="chip" id="comboChip" hidden>Серія <b id="combo">×1</b></div>
    <div class="chip" id="weaponChip" hidden><span id="weaponName"></span></div>
    <div class="chip" id="bossChip" hidden>Бос <div class="meter boss"><i id="bossFill"></i></div></div>
    <div class="spacer"></div>
    <button class="chip" id="muteBtn" type="button">Звук: так</button>
  </div>

  <button id="dashBtn" type="button">Ривок</button>

  <div id="overlay"><div class="panel" id="panel"></div></div>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const C = { paper: '#e4dcc8', grid: '#d6cdb5', ink: '#1c1b29', blue: '#2d4bff', orange: '#ff5a2e',
            yellow: '#f5b400', purple: '#9b2fae', green: '#17936a', white: '#fffdf6', crimson: '#c81d4a' };
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('game'), ctx = cv.getContext('2d');
const inkCv = document.createElement('canvas'), ictx = inkCv.getContext('2d');
const overlay = $('overlay'), panel = $('panel');

/* ---------- best score (guarded storage) ---------- */
let best = 0;
try { best = +localStorage.getItem('ink-arena-best') || 0; } catch (e) {}
function saveBest() { try { localStorage.setItem('ink-arena-best', String(best)); } catch (e) {} }

/* ---------- layout ---------- */
let W = 0, H = 0, scale = 1, dpr = 1;
function layout() {
  const vw = stage.clientWidth, vh = stage.clientHeight;
  const land = vw >= vh;
  const nW = land ? 1280 : 720, nH = land ? 720 : 1280;
  if (nW !== W || nH !== H) {
    W = nW; H = nH;
    inkCv.width = W; inkCv.height = H;
  }
  scale = Math.min((vw - 6) / W, (vh - 6) / H);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  cv.style.width = Math.round(W * scale) + 'px';
  cv.style.height = Math.round(H * scale) + 'px';
}
window.addEventListener('resize', layout);

/* ---------- audio ---------- */
let ac = null, muted = false;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function beep(freq, dur, type, vol, slide) {
  if (muted || !ac) return;
  try {
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol || .04, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) {}
}
function setMuted(m) { muted = m; $('muteBtn').textContent = 'Звук: ' + (muted ? 'ні' : 'так'); }

/* ---------- game data ---------- */
const WEAPONS = {
  pistol:  { name: 'Пістолет',  cd: .2,   n: 1, spread: .03,  speed: 900,  life: .9,  shake: 1.5, snd: [520, -320, .04] },
  smg:     { name: 'Автомат',   cd: .075, n: 1, spread: .12,  speed: 950,  life: .8,  shake: 1,   snd: [640, -380, .03] },
  shotgun: { name: 'Дробовик',  cd: .6,   n: 7, spread: .55,  speed: 760,  life: .5,  shake: 5,   snd: [180, -100, .07] },
  rocket:  { name: 'Ракетниця', cd: .85,  n: 1, spread: .015, speed: 620,  life: 1.4, shake: 7,   snd: [140, -90, .08], splash: true, splashR: 95, splashDmg: 3 },
  laser:   { name: 'Лазер',     cd: .45,  n: 1, spread: .008, speed: 1500, life: .55, shake: 2.5, snd: [900, -260, .028], pierce: 2 }
};
const TYPES = {
  runner:  { r: 11, hp: 1,  sp: 200, dmg: 8,  pts: 10, col: C.yellow },
  grunt:   { r: 15, hp: 3,  sp: 110, dmg: 15, pts: 20, col: C.orange },
  shooter: { r: 14, hp: 3,  sp: 85,  dmg: 10, pts: 40, col: C.green },
  tank:    { r: 26, hp: 12, sp: 62,  dmg: 30, pts: 60, col: C.purple }
};

let state = 'menu';            // menu | playing | paused | over
let player, bullets, ebullets, enemies, parts, pickups, texts;
let wave, waveState, queue, spawnT, breakT, banner;
let score, combo, comboT, shake, hurtFx, time;
let obstacles = [], bossWave = false, bossSpawned = false;

function resetGame() {
  player = { x: W / 2, y: H / 2, r: 14, hp: 100, max: 100, angle: 0, fireCd: 0, weapon: 'pistol', weaponT: 0,
             inv: 0, dash: 0, dashCd: 0, dvx: 0, dvy: 0, flash: 0 };
  bullets = []; ebullets = []; enemies = []; parts = []; pickups = []; texts = [];
  wave = 0; waveState = 'break'; queue = []; spawnT = 0; breakT = 0; banner = null;
  score = 0; combo = 0; comboT = 0; shake = 0; hurtFx = 0; time = 0;
  obstacles = []; bossWave = false; bossSpawned = false;
  ictx.clearRect(0, 0, W, H);
}

/* ---------- input ---------- */
const keys = {};
const mouse = { x: 0, y: 0, has: false, down: false };
const touch = { move: null, aim: null };
const STICK = 64;

function toL(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale };
}
function setMouse(e) { const p = toL(e); mouse.x = p.x; mouse.y = p.y; mouse.has = true; }

window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  audio();
  if (e.code === 'Space') tryDash();
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if (e.code === 'KeyM') setMuted(!muted);
  if (e.code === 'Enter' && (state === 'menu' || state === 'over')) startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (state === 'playing') pause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') pause(); });
stage.addEventListener('contextmenu', e => e.preventDefault());

stage.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse') {
    if (e.button !== 0) return;
    mouse.down = true; setMouse(e); audio(); return;
  }
  document.body.classList.add('touch');
  audio();
  if (state !== 'playing') return;
  const p = toL(e);
  const key = p.x < W / 2 ? 'move' : 'aim';
  if (touch[key]) return;
  touch[key] = { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y, vx: 0, vy: 0, mag: 0, ang: 0 };
  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
});
window.addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { setMouse(e); return; }
  for (const k of ['move', 'aim']) {
    const t = touch[k];
    if (!t || t.id !== e.pointerId) continue;
    const p = toL(e);
    t.x = p.x; t.y = p.y;
    let dx = p.x - t.ox, dy = p.y - t.oy;
    const d = Math.hypot(dx, dy);
    if (d > STICK * 1.5) { t.ox = p.x - dx / d * STICK * 1.5; t.oy = p.y - dy / d * STICK * 1.5; dx = p.x - t.ox; dy = p.y - t.oy; }
    const dd = Math.hypot(dx, dy);
    t.mag = Math.min(1, dd / STICK);
    t.ang = Math.atan2(dy, dx);
    const live = t.mag > .15;
    t.vx = live ? Math.cos(t.ang) * t.mag : 0;
    t.vy = live ? Math.sin(t.ang) * t.mag : 0;
  }
});
function endPtr(e) {
  if (e.pointerType === 'mouse') { mouse.down = false; return; }
  for (const k of ['move', 'aim']) if (touch[k] && touch[k].id === e.pointerId) touch[k] = null;
}
window.addEventListener('pointerup', endPtr);
window.addEventListener('pointercancel', endPtr);

overlay.addEventListener('pointerdown', e => e.stopPropagation());
$('hud').addEventListener('pointerdown', e => e.stopPropagation());
$('muteBtn').addEventListener('click', () => { audio(); setMuted(!muted); $('muteBtn').blur(); });
$('dashBtn').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); audio(); tryDash(); });

if (window.matchMedia && matchMedia('(pointer: coarse)').matches) document.body.classList.add('touch');

/* ---------- overlays ---------- */
function showOverlay(kind, extra) {
  overlay.hidden = false;
  $('dashBtn').classList.remove('on');
  if (kind === 'menu') {
    panel.innerHTML =
      '<h1>Чорнильна арена</h1>' +
      '<p>Відбивайся від хвиль ворогів. Кожен влучний постріл фарбує підлогу, тож до кінця гри арена стає твоєю картиною.</p>' +
      '<p>На аренах є перешкоди — ховайся за ними від куль. Із ворогів випадають автомат, дробовик, ракетниця (вибух по площі) і лазер (пробиває кількох ворогів). Кожна 5-та хвиля — бос із власними атаками.</p>' +
      '<dl class="keys">' +
      '<dt>W A S D</dt><dd>рух (також стрілки)</dd>' +
      '<dt>Мишка</dt><dd>приціл; утримуй кнопку, щоб стріляти</dd>' +
      '<dt>Пробіл</dt><dd>ривок: короткий час тебе не зачепити</dd>' +
      '<dt>P</dt><dd>пауза</dd></dl>' +
      '<p class="note">На телефоні: лівий палець рухає героя, правий цілиться й стріляє. Кнопка «Ривок» біля правого краю.</p>' +
      (best ? '<p>Рекорд: <b>' + best + '</b></p>' : '') +
      '<button class="btn" id="goBtn" type="button">Грати</button>';
    $('goBtn').addEventListener('click', startGame);
  } else if (kind === 'paused') {
    panel.innerHTML =
      '<h1>Пауза</h1><p>Гра чекає на тебе. Звук вмикається й вимикається клавішею M.</p>' +
      '<button class="btn" id="goBtn" type="button">Продовжити</button>';
    $('goBtn').addEventListener('click', resume);
  } else if (kind === 'over') {
    panel.innerHTML =
      '<h1>Кінець гри</h1><div class="big">' + score + '</div>' +
      '<p>Ти дійшов до хвилі ' + wave + '. Рекорд: ' + best + (extra ? ' — це новий рекорд!' : '.') + '</p>' +
      '<button class="btn" id="goBtn" type="button">Грати ще раз</button>';
    $('goBtn').addEventListener('click', startGame);
  }
  const b = $('goBtn'); if (b) b.focus({ preventScroll: true });
}
function hideOverlay() {
  overlay.hidden = true;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  $('dashBtn').classList.add('on');
}

function startGame() {
  audio();
  resetGame();
  state = 'playing';
  hideOverlay();
  startWave(1);
}
function pause() { if (state !== 'playing') return; state = 'paused'; touch.move = touch.aim = null; showOverlay('paused'); }
function resume() { if (state !== 'paused') return; state = 'playing'; hideOverlay(); }
function togglePause() { if (state === 'playing') pause(); else if (state === 'paused') resume(); }

function gameOver() {
  state = 'over';
  touch.move = touch.aim = null;
  const isNew = score > best;
  if (isNew) { best = score; saveBest(); }
  splat(player.x, player.y, C.blue, 34, rand(0, TAU));
  burst(player.x, player.y, C.blue, 30, 340);
  shake = 14;
  beep(160, .6, 'sawtooth', .06, -110);
  setTimeout(() => { if (state === 'over') showOverlay('over', isNew && score > 0); }, 900);
}

/* ---------- waves ---------- */
function pickType(n) {
  const pool = [['runner', 4], ['grunt', 3 + n * .2]];
  if (n >= 3) pool.push(['shooter', 1.5 + n * .2]);
  if (n >= 4) pool.push(['tank', .6 + n * .15]);
  let sum = 0; for (const p of pool) sum += p[1];
  let r = Math.random() * sum;
  for (const p of pool) { r -= p[1]; if (r <= 0) return p[0]; }
  return 'runner';
}
function startWave(n) {
  wave = n; waveState = 'fight'; queue = [];
  bossWave = n % 5 === 0; bossSpawned = false;
  const total = bossWave ? Math.round(4 + n * 1.6) : 6 + n * 4;
  for (let i = 0; i < total; i++) queue.push(pickType(n));
  obstacles = bossWave ? [] : buildObstacles(n);
  spawnT = 1.4;
  banner = bossWave
    ? { text: 'Хвиля ' + n, sub: 'Наближається бос…', t: 2.4 }
    : { text: 'Хвиля ' + n, sub: '', t: 2 };
  // fade old ink a little so the floor never turns to mush
  ictx.save(); ictx.globalCompositeOperation = 'destination-out'; ictx.fillStyle = 'rgba(0,0,0,.28)'; ictx.fillRect(0, 0, W, H); ictx.restore();
  beep(330, .18, 'triangle', .05, 220);
}
function spawnEnemy(type, px, py) {
  const t = TYPES[type], m = 40;
  let x, y;
  if (px !== undefined) { x = px; y = py; }
  else {
    const side = Math.floor(Math.random() * 4);
    if (side === 0) { x = rand(0, W); y = -m; } else if (side === 1) { x = W + m; y = rand(0, H); }
    else if (side === 2) { x = rand(0, W); y = H + m; } else { x = -m; y = rand(0, H); }
  }
  const k = 1 + Math.min(.45, wave * .03);
  enemies.push({ type, x, y, r: t.r, hp: t.hp, maxhp: t.hp, sp: t.sp * k * rand(.92, 1.08), kx: 0, ky: 0, flash: 0,
                 fireT: rand(1, 2.5), phase: rand(0, TAU), col: t.col, dmg: t.dmg, pts: t.pts, look: 0, dead: false });
}

/* ---------- obstacles ---------- */
const OBSTACLE_LAYOUTS = [
  (w, h) => ([
    { x: w * .18, y: h * .32, w: w * .10, h: h * .36 },
    { x: w * .72, y: h * .32, w: w * .10, h: h * .36 }
  ]),
  (w, h) => ([
    { x: w * .40, y: h * .10, w: w * .20, h: h * .10 },
    { x: w * .40, y: h * .80, w: w * .20, h: h * .10 },
    { x: w * .08, y: h * .45, w: w * .14, h: h * .10 },
    { x: w * .78, y: h * .45, w: w * .14, h: h * .10 }
  ]),
  (w, h) => ([
    { x: w * .30, y: h * .58, w: w * .40, h: h * .07 },
    { x: w * .14, y: h * .14, w: w * .12, h: h * .12 },
    { x: w * .74, y: h * .14, w: w * .12, h: h * .12 },
    { x: w * .14, y: h * .74, w: w * .12, h: h * .12 },
    { x: w * .74, y: h * .74, w: w * .12, h: h * .12 }
  ]),
  (w, h) => ([
    { x: w * .24, y: h * .20, w: w * .09, h: h * .09 },
    { x: w * .67, y: h * .20, w: w * .09, h: h * .09 },
    { x: w * .24, y: h * .71, w: w * .09, h: h * .09 },
    { x: w * .67, y: h * .71, w: w * .09, h: h * .09 },
    { x: w * .07, y: h * .455, w: w * .07, h: h * .09 },
    { x: w * .86, y: h * .455, w: w * .07, h: h * .09 }
  ])
];
function buildObstacles(n) {
  const layout = OBSTACLE_LAYOUTS[(n - 1) % OBSTACLE_LAYOUTS.length];
  return layout(W, H).map(r => ({ x: r.x, y: r.y, w: r.w, h: r.h }));
}
function resolveObstacles(x, y, r) {
  for (const o of obstacles) {
    const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
    const dx = x - cx, dy = y - cy, d2 = dx * dx + dy * dy;
    if (d2 < r * r) {
      const d = Math.sqrt(d2) || .0001, push = r - d;
      x += dx / d * push; y += dy / d * push;
    }
  }
  return { x, y };
}
function hitsObstacle(x, y, r) {
  for (const o of obstacles) {
    const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
    const dx = x - cx, dy = y - cy;
    if (dx * dx + dy * dy < r * r) return true;
  }
  return false;
}

/* ---------- boss ---------- */
const BOSS_BASE = { r: 44, sp: 58, dmg: 22 };
function spawnBoss(n) {
  const hp = Math.round(110 + n * 42);
  enemies.push({ type: 'boss', x: W / 2, y: -90, r: BOSS_BASE.r, hp, maxhp: hp, sp: BOSS_BASE.sp,
                 kx: 0, ky: 0, flash: 0, col: C.crimson, dmg: BOSS_BASE.dmg, pts: 400 + n * 60,
                 look: -Math.PI / 2, dead: false, atkState: 'enter', stateT: .1, tx: 0, ty: 1, cvx: 0, cvy: 0 });
  banner = { text: 'БОС', sub: 'Знищ його, доки не пізно!', t: 2.4 };
  beep(90, .5, 'sawtooth', .08, 60);
}
function bossSetState(e, s) {
  e.atkState = s;
  if (s === 'move') e.stateT = rand(2.3, 3.2);
  else if (s === 'telegraph') { e.stateT = .5; e.tx = Math.cos(e.look); e.ty = Math.sin(e.look); }
  else if (s === 'charge') { e.stateT = .42; e.cvx = e.tx * 640; e.cvy = e.ty * 640; beep(110, .12, 'square', .05, -30); }
  else if (s === 'burstwind') e.stateT = .35;
  else if (s === 'summonwind') e.stateT = .3;
  else if (s === 'cool') e.stateT = .6;
}
function bossBurst(e) {
  const N = 14;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU + rand(-.05, .05);
    ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 230, vy: Math.sin(a) * 230, life: 3.2, r: 7, dmg: 14, dead: false });
  }
  beep(200, .22, 'sawtooth', .05, -150);
  shake = Math.min(14, shake + 5);
}
function bossSummon(e) {
  for (let i = 0; i < 2; i++) {
    const a = rand(0, TAU), d = e.r + 40;
    spawnEnemy(Math.random() < .5 ? 'runner' : 'grunt', e.x + Math.cos(a) * d, e.y + Math.sin(a) * d);
  }
  beep(400, .2, 'triangle', .04, 120);
}

/* ---------- actions ---------- */
function tryDash() {
  if (state !== 'playing') return;
  const p = player;
  if (p.dashCd > 0) return;
  let ix = 0, iy = 0;
  if (keys.KeyA || keys.ArrowLeft) ix--; if (keys.KeyD || keys.ArrowRight) ix++;
  if (keys.KeyW || keys.ArrowUp) iy--; if (keys.KeyS || keys.ArrowDown) iy++;
  if (touch.move) { ix += touch.move.vx; iy += touch.move.vy; }
  let l = Math.hypot(ix, iy);
  if (l < .1) { ix = Math.cos(p.angle); iy = Math.sin(p.angle); l = 1; }
  p.dvx = ix / l * 900; p.dvy = iy / l * 900;
  p.dash = .16; p.dashCd = 1.3; p.inv = Math.max(p.inv, .25);
  beep(300, .14, 'triangle', .05, 260);
}
function fire() {
  const p = player, w = WEAPONS[p.weapon];
  for (let i = 0; i < w.n; i++) {
    const a = p.angle + (w.n > 1 ? (i / (w.n - 1) - .5) * w.spread + rand(-.04, .04) : rand(-w.spread, w.spread));
    const sp = w.speed * rand(.94, 1.06);
    bullets.push({ x: p.x + Math.cos(p.angle) * 22, y: p.y + Math.sin(p.angle) * 22,
                   vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: w.life, dmg: 1, r: w.splash ? 6 : 4, dead: false,
                   pierce: w.pierce || 0, hitSet: (w.pierce ? new Set() : null),
                   splash: !!w.splash, splashR: w.splashR || 0, splashDmg: w.splashDmg || 0 });
  }
  p.fireCd = w.cd; p.flash = .05;
  shake = Math.min(14, shake + w.shake);
  beep(w.snd[0], .07, w.splash ? 'sawtooth' : 'square', w.snd[2], w.snd[1]);
}
function hurt(d) {
  const p = player;
  p.hp -= d; p.inv = .7; hurtFx = .4; combo = 0; comboT = 0;
  shake = Math.min(14, shake + 8);
  splat(p.x, p.y, C.blue, 9, rand(0, TAU));
  burst(p.x, p.y, C.blue, 8, 220);
  beep(130, .22, 'sawtooth', .06, -60);
  if (p.hp <= 0) { p.hp = 0; gameOver(); }
}
function kill(e, ang) {
  e.dead = true;
  const mult = Math.min(5, 1 + Math.floor(combo / 4));
  const gain = e.pts * mult;
  score += gain; combo++; comboT = 2.2;
  texts.push({ x: e.x, y: e.y - e.r, t: .8, text: '+' + gain, col: C.ink });
  splat(e.x, e.y, e.col, e.r * 1.4, ang);
  burst(e.x, e.y, e.col, e.type === 'tank' ? 22 : 10, 260);
  shake = Math.min(14, shake + (e.type === 'tank' ? 6 : 2));
  beep(220, .12, 'triangle', .05, -140);
  const lowHp = 1 - player.hp / player.max;
  const r = Math.random();
  if (e.type !== 'runner' && r < .08 + lowHp * .1) pickups.push({ x: e.x, y: e.y, type: 'hp', life: 10, ph: rand(0, TAU) });
  else if (r > .92) {
    const pool = ['smg', 'shotgun', 'rocket', 'laser'];
    pickups.push({ x: e.x, y: e.y, type: pool[Math.floor(Math.random() * pool.length)], life: 10, ph: rand(0, TAU) });
  }
}

/* ---------- fx helpers ---------- */
function splat(x, y, col, size, ang) {
  ictx.fillStyle = col; ictx.globalAlpha = .88;
  const n = Math.floor(4 + size / 3);
  for (let i = 0; i < n; i++) {
    const a = ang + rand(-.9, .9), d = rand(0, size * 1.7);
    const r = Math.max(1.6, rand(size * .16, size * .5) * (1 - d / (size * 2.4)));
    ictx.beginPath(); ictx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r, 0, TAU); ictx.fill();
  }
  ictx.beginPath(); ictx.arc(x, y, size * .62, 0, TAU); ictx.fill();
  ictx.globalAlpha = 1;
}
function burst(x, y, col, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(sp * .25, sp);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.25, .55), max: .55, r: rand(2, 4.5), col });
  }
}
function sparks(x, y, col, n, ang) {
  for (let i = 0; i < n; i++) {
    const a = ang + rand(-1.1, 1.1), s = rand(80, 240);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.15, .3), max: .3, r: rand(1.5, 3), col });
  }
}
function explode(x, y, radius, dmg) {
  splat(x, y, C.orange, radius * .85, rand(0, TAU));
  burst(x, y, C.orange, 24, 300);
  shake = Math.min(14, shake + 8);
  beep(150, .2, 'sawtooth', .06, -100);
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = e.x - x, dy = e.y - y, d = Math.hypot(dx, dy);
    if (d < radius + e.r) {
      e.hp -= dmg; e.flash = .08;
      const k = 140, ux = dx / (d || 1), uy = dy / (d || 1);
      e.kx += ux * k; e.ky += uy * k;
      if (e.hp <= 0) kill(e, Math.atan2(dy, dx));
    }
  }
}
function updateFx(dt) {
  for (const q of parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= Math.exp(-5 * dt); q.vy *= Math.exp(-5 * dt); q.life -= dt; }
  parts = parts.filter(q => q.life > 0);
  for (const t of texts) { t.y -= 28 * dt; t.t -= dt; }
  texts = texts.filter(t => t.t > 0);
  shake *= Math.exp(-10 * dt);
  if (shake < .1) shake = 0;
  hurtFx = Math.max(0, hurtFx - dt);
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }
}

/* ---------- update ---------- */
function update(dt) {
  time += dt;
  const p = player;

  // movement input
  let ix = 0, iy = 0;
  if (keys.KeyA || keys.ArrowLeft) ix--; if (keys.KeyD || keys.ArrowRight) ix++;
  if (keys.KeyW || keys.ArrowUp) iy--; if (keys.KeyS || keys.ArrowDown) iy++;
  if (touch.move) { ix += touch.move.vx; iy += touch.move.vy; }
  const il = Math.hypot(ix, iy);
  if (il > 1) { ix /= il; iy /= il; }

  if (p.dash > 0) {
    p.x += p.dvx * dt; p.y += p.dvy * dt; p.dash -= dt;
    parts.push({ x: p.x, y: p.y, vx: 0, vy: 0, life: .25, max: .25, r: 9, col: C.blue });
  } else {
    p.x += ix * 265 * dt; p.y += iy * 265 * dt;
  }
  const pr = resolveObstacles(p.x, p.y, p.r); p.x = pr.x; p.y = pr.y;
  p.x = clamp(p.x, p.r + 8, W - p.r - 8);
  p.y = clamp(p.y, p.r + 8, H - p.r - 8);

  p.fireCd -= dt; p.inv -= dt; p.dashCd -= dt; p.flash -= dt;
  if (p.weapon !== 'pistol') { p.weaponT -= dt; if (p.weaponT <= 0) { p.weapon = 'pistol'; } }

  // aim & fire
  if (touch.aim && touch.aim.mag > .15) p.angle = touch.aim.ang;
  else if (mouse.has && !touch.aim) p.angle = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  const wantFire = mouse.down || !!touch.aim;
  if (wantFire && p.fireCd <= 0) fire();

  // player bullets
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { b.dead = true; continue; }
    if (hitsObstacle(b.x, b.y, b.r)) {
      if (b.splash) explode(b.x, b.y, b.splashR, b.splashDmg);
      else sparks(b.x, b.y, C.ink, 4, Math.atan2(b.vy, b.vx) + Math.PI);
      b.dead = true; continue;
    }
    for (const e of enemies) {
      if (e.dead || (b.hitSet && b.hitSet.has(e))) continue;
      const dx = e.x - b.x, dy = e.y - b.y, rr = e.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        e.hp -= b.dmg; e.flash = .08;
        const a = Math.atan2(b.vy, b.vx), k = (e.type === 'tank' || e.type === 'boss') ? 50 : 150;
        e.kx += Math.cos(a) * k; e.ky += Math.sin(a) * k;
        sparks(b.x, b.y, e.col, 4, a + Math.PI);
        beep(420, .05, 'square', .02, -200);
        if (e.hp <= 0) kill(e, a);
        if (b.splash) { explode(b.x, b.y, b.splashR, b.splashDmg); b.dead = true; break; }
        if (b.hitSet) { b.hitSet.add(e); if (b.pierce > 0) b.pierce--; else { b.dead = true; break; } }
        else { b.dead = true; break; }
      }
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // enemies
  for (const e of enemies) {
    if (e.dead) continue;
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    e.look = Math.atan2(dy, dx);
    let mx = 0, my = 0;

    if (e.type === 'boss') {
      e.stateT -= dt;
      if (e.atkState === 'enter') {
        e.y += 90 * dt;
        if (e.y > 130) bossSetState(e, 'move');
      } else if (e.atkState === 'move') {
        mx = ux; my = uy;
        if (d < 260) { mx = -ux; my = -uy; }
        if (e.stateT <= 0) {
          const r = Math.random();
          bossSetState(e, r < .4 ? 'telegraph' : r < .72 ? 'burstwind' : 'summonwind');
        }
      } else if (e.atkState === 'telegraph') {
        if (e.stateT <= 0) bossSetState(e, 'charge');
      } else if (e.atkState === 'charge') {
        mx = e.cvx / e.sp; my = e.cvy / e.sp;
        if (e.stateT <= 0) bossSetState(e, 'cool');
      } else if (e.atkState === 'burstwind') {
        if (e.stateT <= 0) { bossBurst(e); bossSetState(e, 'cool'); }
      } else if (e.atkState === 'summonwind') {
        if (e.stateT <= 0) { bossSummon(e); bossSetState(e, 'cool'); }
      } else if (e.atkState === 'cool') {
        if (e.stateT <= 0) bossSetState(e, 'move');
      }
    } else if (e.type === 'shooter') {
      mx = ux; my = uy;
      if (d < 230) { mx = -ux; my = -uy; }
      else if (d < 340) { const s = Math.sin(e.phase + time * .8) > 0 ? 1 : -1; mx = -uy * s; my = ux * s; }
      e.fireT -= dt;
      const inside = e.x > 10 && e.x < W - 10 && e.y > 10 && e.y < H - 10;
      if (e.fireT <= 0 && inside) {
        e.fireT = rand(1.6, 2.6);
        ebullets.push({ x: e.x + ux * e.r, y: e.y + uy * e.r, vx: ux * 250, vy: uy * 250, life: 4, r: 6, dmg: e.dmg, dead: false });
        beep(260, .1, 'sawtooth', .03, -120);
      }
    } else {
      mx = ux; my = uy;
    }

    if (e.type !== 'boss') {
      for (const o of enemies) {
        if (o === e || o.dead) continue;
        const ox = e.x - o.x, oy = e.y - o.y, dd = Math.hypot(ox, oy), min = e.r + o.r;
        if (dd > 0 && dd < min) { const f = (min - dd) / min; mx += ox / dd * f * 1.6; my += oy / dd * f * 1.6; }
      }
    }

    e.x += (mx * e.sp + e.kx) * dt; e.y += (my * e.sp + e.ky) * dt;
    const er = resolveObstacles(e.x, e.y, e.r); e.x = er.x; e.y = er.y;
    if (e.type === 'boss') { e.x = clamp(e.x, e.r + 20, W - e.r - 20); e.y = clamp(e.y, e.r + 20, H - e.r - 20); }
    const decay = Math.exp(-8 * dt); e.kx *= decay; e.ky *= decay;
    e.flash -= dt;
    if (d < e.r + p.r - 2 && p.inv <= 0) { hurt(e.dmg); e.kx = -ux * 420; e.ky = -uy * 420; }
    if (state !== 'playing') return;
  }
  enemies = enemies.filter(e => !e.dead);

  // enemy bullets
  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) { b.dead = true; continue; }
    if (hitsObstacle(b.x, b.y, b.r)) { sparks(b.x, b.y, C.orange, 3, 0); b.dead = true; continue; }
    const dx = p.x - b.x, dy = p.y - b.y, rr = p.r + b.r;
    if (dx * dx + dy * dy < rr * rr && p.inv <= 0) { b.dead = true; hurt(b.dmg); if (state !== 'playing') return; }
  }
  ebullets = ebullets.filter(b => !b.dead);

  // pickups
  for (const k of pickups) {
    k.life -= dt;
    const dx = p.x - k.x, dy = p.y - k.y;
    if (dx * dx + dy * dy < (p.r + 16) * (p.r + 16)) {
      k.life = 0;
      if (k.type === 'hp') { p.hp = Math.min(p.max, p.hp + 25); texts.push({ x: p.x, y: p.y - 24, t: .9, text: '+25 життя', col: C.green }); }
      else { p.weapon = k.type; p.weaponT = 14; texts.push({ x: p.x, y: p.y - 24, t: .9, text: WEAPONS[k.type].name, col: C.blue }); }
      beep(700, .15, 'sine', .05, 420);
    }
  }
  pickups = pickups.filter(k => k.life > 0);

  // waves
  if (waveState === 'fight') {
    if (queue.length) {
      spawnT -= dt;
      if (spawnT <= 0 && enemies.length < 14 + wave * 2) {
        spawnEnemy(queue.pop());
        spawnT = Math.max(.22, .85 - wave * .05) * rand(.7, 1.2);
      }
    } else if (!enemies.length) {
      if (bossWave && !bossSpawned) {
        bossSpawned = true;
        spawnBoss(wave);
      } else {
        waveState = 'break'; breakT = 2.4;
        const bonus = 50 * wave;
        score += bonus;
        p.hp = Math.min(p.max, p.hp + 10);
        banner = { text: 'Хвилю зачищено', sub: '+' + bonus + ' до рахунку', t: 2.2 };
        beep(520, .25, 'triangle', .05, 300);
      }
    }
  } else {
    breakT -= dt;
    if (breakT <= 0) startWave(wave + 1);
  }

  // combo
  if (combo > 0) { comboT -= dt; if (comboT <= 0) combo = 0; }

  updateFx(dt);
}

/* ---------- drawing ---------- */
function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.fillStyle = 'rgba(28,27,41,.16)';
  ctx.beginPath(); ctx.ellipse(0, e.r * .7, e.r, e.r * .5, 0, 0, TAU); ctx.fill();
  const lx = Math.cos(e.look), ly = Math.sin(e.look);
  if (e.type === 'shooter') {
    ctx.save(); ctx.rotate(e.look); ctx.fillStyle = C.ink; ctx.fillRect(e.r * .3, -4, e.r + 6, 8); ctx.restore();
  }
  if (e.type === 'boss') {
    ctx.save(); ctx.rotate(time * .6);
    ctx.fillStyle = C.ink;
    for (let i = 0; i < 8; i++) {
      ctx.save(); ctx.rotate((i / 8) * TAU);
      ctx.beginPath(); ctx.moveTo(e.r - 4, -8); ctx.lineTo(e.r + 16, 0); ctx.lineTo(e.r - 4, 8); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    if (e.atkState === 'telegraph' || e.atkState === 'charge') {
      ctx.save(); ctx.strokeStyle = C.orange; ctx.lineWidth = 4; ctx.globalAlpha = .7 + .3 * Math.sin(time * 30);
      ctx.beginPath(); ctx.arc(0, 0, e.r + 10, 0, TAU); ctx.stroke(); ctx.restore();
    }
  }
  ctx.fillStyle = e.flash > 0 ? C.white : e.col; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, e.r, 0, TAU); ctx.fill(); ctx.stroke();
  if (e.type === 'tank') {
    ctx.strokeStyle = 'rgba(255,253,246,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, 0, e.r - 7, 0, TAU); ctx.stroke();
  }
  const er = e.r * .27;
  for (const s of [-1, 1]) {
    const cx = lx * e.r * .34 + (-ly) * s * e.r * .38, cy = ly * e.r * .34 + lx * s * e.r * .38;
    ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(cx, cy, er, 0, TAU); ctx.fill();
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(cx + lx * er * .4, cy + ly * er * .4, er * .5, 0, TAU); ctx.fill();
  }
  if (e.maxhp > 3 && e.hp < e.maxhp) {
    ctx.fillStyle = C.ink; ctx.fillRect(-e.r, -e.r - 12, e.r * 2, 6);
    ctx.fillStyle = C.orange; ctx.fillRect(-e.r + 1, -e.r - 11, (e.r * 2 - 2) * e.hp / e.maxhp, 4);
  }
  ctx.restore();
}
function drawPlayer() {
  const p = player;
  if (p.hp <= 0) return;
  ctx.save(); ctx.translate(p.x, p.y);
  ctx.fillStyle = 'rgba(28,27,41,.16)';
  ctx.beginPath(); ctx.ellipse(0, p.r * .7, p.r, p.r * .5, 0, 0, TAU); ctx.fill();
  if (p.inv > 0 && Math.floor(time * 24) % 2 === 0) ctx.globalAlpha = .45;
  ctx.rotate(p.angle);
  ctx.fillStyle = C.ink; ctx.fillRect(p.r * .4, -4.5, p.r + 10, 9);
  if (p.flash > 0) {
    ctx.fillStyle = C.yellow; ctx.beginPath();
    ctx.moveTo(p.r + 10, 0); ctx.lineTo(p.r + 26, -7); ctx.lineTo(p.r + 22, 0); ctx.lineTo(p.r + 26, 7); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = C.blue; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, p.r, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(p.r * .35, 0, p.r * .32, 0, TAU); ctx.fill();
  ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(p.r * .45, 0, p.r * .16, 0, TAU); ctx.fill();
  ctx.restore();
}
function drawPickup(k) {
  const blink = k.life < 3 && Math.floor(k.life * 6) % 2 === 0;
  if (blink) return;
  const bob = Math.sin(time * 4 + k.ph) * 3;
  ctx.save(); ctx.translate(k.x, k.y + bob);
  ctx.fillStyle = C.white; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-14, -14, 28, 28, 7) : ctx.rect(-14, -14, 28, 28); ctx.fill(); ctx.stroke();
  ctx.fillStyle = C.ink; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
  if (k.type === 'hp') {
    ctx.fillStyle = C.green; ctx.fillRect(-3.5, -9, 7, 18); ctx.fillRect(-9, -3.5, 18, 7);
  } else if (k.type === 'smg') {
    ctx.fillStyle = C.blue; for (let i = -1; i <= 1; i++) ctx.fillRect(-9, i * 6 - 1.5, 18, 3);
  } else if (k.type === 'shotgun') {
    ctx.strokeStyle = C.orange; ctx.lineWidth = 2.5;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(8, i * 8); ctx.stroke(); }
  } else if (k.type === 'rocket') {
    ctx.fillStyle = C.orange; ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(4, -6); ctx.lineTo(9, 0); ctx.lineTo(4, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = C.ink; ctx.fillRect(-11, -2.5, 6, 5);
  } else if (k.type === 'laser') {
    ctx.strokeStyle = C.blue; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-9, 5); ctx.lineTo(9, -5); ctx.stroke();
    ctx.strokeStyle = C.orange; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-9, -5); ctx.lineTo(9, 5); ctx.stroke();
  }
  ctx.restore();
}
function drawObstacles() {
  for (const o of obstacles) {
    ctx.save();
    ctx.fillStyle = 'rgba(28,27,41,.18)';
    ctx.fillRect(o.x + 5, o.y + 8, o.w, o.h);
    ctx.fillStyle = '#cfc6ad'; ctx.strokeStyle = C.ink; ctx.lineWidth = 4;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(o.x, o.y, o.w, o.h, 8); else ctx.rect(o.x, o.y, o.w, o.h);
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(28,27,41,.25)'; ctx.lineWidth = 2;
    for (let i = 1; i < 3; i++) { ctx.beginPath(); ctx.moveTo(o.x, o.y + o.h * i / 3); ctx.lineTo(o.x + o.w, o.y + o.h * i / 3); ctx.stroke(); }
    ctx.restore();
  }
}
function drawBanner() {
  if (!banner) return;
  const a = Math.min(1, banner.t / .5, (2.2 - Math.min(2.2, banner.t)) / .2 + .0);
  ctx.save(); ctx.globalAlpha = clamp(Math.min(banner.t / .5, 1), 0, 1);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = "800 " + Math.round(W * .05) + "px Unbounded, system-ui, sans-serif";
  ctx.lineWidth = 8; ctx.strokeStyle = C.paper; ctx.strokeText(banner.text, W / 2, H * .3);
  ctx.fillStyle = C.ink; ctx.fillText(banner.text, W / 2, H * .3);
  if (banner.sub) {
    ctx.font = "600 22px Onest, system-ui, sans-serif";
    ctx.lineWidth = 5; ctx.strokeText(banner.sub, W / 2, H * .3 + W * .045);
    ctx.fillText(banner.sub, W / 2, H * .3 + W * .045);
  }
  ctx.restore();
}
function drawSticks() {
  if (state !== 'playing') return;
  for (const k of ['move', 'aim']) {
    const t = touch[k]; if (!t) continue;
    ctx.save(); ctx.lineWidth = 3; ctx.strokeStyle = C.ink; ctx.globalAlpha = .55;
    ctx.beginPath(); ctx.arc(t.ox, t.oy, STICK, 0, TAU); ctx.stroke();
    ctx.fillStyle = k === 'move' ? C.blue : C.orange; ctx.globalAlpha = .8;
    const d = Math.min(STICK, Math.hypot(t.x - t.ox, t.y - t.oy)), a = Math.atan2(t.y - t.oy, t.x - t.ox);
    ctx.beginPath(); ctx.arc(t.ox + Math.cos(a) * d, t.oy + Math.sin(a) * d, 26, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}
function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = C.grid; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = 0; x <= W; x += 80) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y <= H; y += 80) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  ctx.save();
  if (shake > 0 && !reduceMotion) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  else if (shake > 0) ctx.translate(rand(-shake, shake) * .25, rand(-shake, shake) * .25);
  ctx.drawImage(inkCv, 0, 0);
  drawObstacles();
  for (const k of pickups) drawPickup(k);
  for (const e of enemies) drawEnemy(e);
  for (const b of ebullets) {
    ctx.fillStyle = C.orange; ctx.strokeStyle = C.ink; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.lineCap = 'round';
  for (const b of bullets) {
    if (b.splash) {
      ctx.strokeStyle = C.ink; ctx.lineWidth = 9;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .02, b.y - b.vy * .02); ctx.stroke();
      ctx.strokeStyle = C.orange; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .02, b.y - b.vy * .02); ctx.stroke();
    } else if (b.hitSet) {
      ctx.strokeStyle = C.blue; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .03, b.y - b.vy * .03); ctx.stroke();
      ctx.strokeStyle = C.white; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .03, b.y - b.vy * .03); ctx.stroke();
    } else {
      ctx.strokeStyle = C.ink; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .018, b.y - b.vy * .018); ctx.stroke();
      ctx.strokeStyle = C.yellow; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * .018, b.y - b.vy * .018); ctx.stroke();
    }
  }
  drawPlayer();
  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = "800 17px Onest, system-ui, sans-serif";
  for (const t of texts) {
    ctx.globalAlpha = clamp(t.t / .4, 0, 1);
    ctx.lineWidth = 4; ctx.strokeStyle = C.paper; ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.col; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (hurtFx > 0) {
    ctx.save(); ctx.globalAlpha = hurtFx / .4 * .5; ctx.strokeStyle = C.orange; ctx.lineWidth = 36;
    ctx.strokeRect(0, 0, W, H); ctx.restore();
  }
  ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.strokeRect(3, 3, W - 6, H - 6);
  drawBanner();
  drawSticks();
}

/* ---------- HUD ---------- */
const hud = { hp: -1, dash: -1, score: -1, wave: -1, combo: -1, wname: '', boss: -2 };
function updateHud() {
  const p = player;
  const hp = Math.round(p.hp / p.max * 100);
  if (hp !== hud.hp) { hud.hp = hp; $('hpFill').style.transform = 'scaleX(' + hp / 100 + ')'; $('hpFill').classList.toggle('low', hp <= 30); }
  const dash = Math.round(clamp(1 - p.dashCd / 1.3, 0, 1) * 20);
  if (dash !== hud.dash) { hud.dash = dash; $('dashFill').style.transform = 'scaleX(' + dash / 20 + ')'; }
  if (score !== hud.score) { hud.score = score; $('score').textContent = score; }
  if (wave !== hud.wave) { hud.wave = wave; $('wave').textContent = Math.max(1, wave); }
  const mult = combo > 0 ? Math.min(5, 1 + Math.floor(combo / 4)) : 0;
  const ck = mult * 1000 + combo;
  if (ck !== hud.combo) {
    hud.combo = ck;
    $('comboChip').hidden = combo < 2;
    $('combo').textContent = '×' + mult + ' (' + combo + ')';
  }
  const wn = p.weapon !== 'pistol' ? WEAPONS[p.weapon].name + ' ' + Math.ceil(p.weaponT) + ' с' : '';
  if (wn !== hud.wname) { hud.wname = wn; $('weaponChip').hidden = !wn; $('weaponName').textContent = wn; }
  const bossEnemy = enemies.find(x => x.type === 'boss' && !x.dead);
  const bossPct = bossEnemy ? Math.max(0, bossEnemy.hp / bossEnemy.maxhp) : -1;
  if (bossPct !== hud.boss) {
    hud.boss = bossPct;
    $('bossChip').hidden = bossPct < 0;
    if (bossPct >= 0) $('bossFill').style.transform = 'scaleX(' + bossPct + ')';
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(t) {
  const dt = Math.min(.033, (t - last) / 1000);
  last = t;
  if (state === 'playing') update(dt);
  else if (state === 'over') updateFx(dt);
  draw();
  updateHud();
  requestAnimationFrame(frame);
}

layout();
resetGame();
showOverlay('menu');
requestAnimationFrame(frame);
})();
</script>
</body>
